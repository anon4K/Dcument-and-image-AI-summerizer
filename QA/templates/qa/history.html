<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>History</title>
<style>
  :root { --bg:#0f1115; 
    --panel:#171a21; 
    --border:#272b35; 
    --text:#e8e9ec; 
    --muted:#8b8f9a; 
    --accent:#6c8cff; 
}
  body { 
    margin:0; 
    font-family: 
    -apple-system, Segoe UI, Roboto, sans-serif; 
    background:var(--bg); 
    color:var(--text); 
    padding:40px 20px;
}
  .wrap { 
    max-width: 760px; 
    margin: 0 auto; 
}
  h1 { 
    font-size:22px; 
    margin-bottom:4px;
    font-weight:600;
}
  nav a { 
    color:var(--accent); 
    text-decoration:none; 
    font-size:14px; 
}
  table { 
    width:100%; 
    border-collapse:collapse; 
    margin-top:20px; 
    font-size:13px; 
}
  th, td { 
    text-align:left; 
    padding:10px 12px; 
    border-bottom:1px solid var(--border); 
    vertical-align:top; 
}
  th { 
    color:var(--muted); 
    font-weight:500; 
}
  .kind { 
    display:inline-block; 
    padding:2px 8px; 
    border-radius:6px; 
    font-size:11px; 
    background:#1a1e2a; 
    color:var(--accent);
 }
  .answer { 
    color:#d4d6db; 
    max-width:420px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
  .empty { 
    color:var(--muted); 
    margin-top:20px; 
}
</style>
</head>
<body>
<div class="wrap">
  <h1>History</h1>
  <nav><a href="/">← Back to upload</a></nav>

  {% if logs %}
  <table>
    <tr><th>File</th><th>Type</th><th>Result</th><th>Latency</th><th>When</th></tr>
    {% for log in logs %}
    <tr>
      <td>{{ log.filename|default:"—" }}</td>
      <td><span class="kind">{{ log.file_kind|default:"—" }}</span></td>
      <td class="answer">{{ log.answer|truncatechars:160 }}</td>
      <td>{{ log.latency_ms }} ms</td>
      <td>{{ log.created_at|date:"M d, H:i" }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <div class="empty">No uploads yet.</div>
  {% endif %}
</div>
</body>
</html>
